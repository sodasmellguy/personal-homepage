spring:
  # 通过 Maven Profile 动态切换环境：dev / master
  profiles:
    active: @profileActive@

  application:
    name: grzy-backend

# MyBatis Plus 配置（公共）
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.grzy.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# CORS 跨域配置（生产环境应配置具体域名，逗号分隔；配置为 * 时不允许携带凭证）
cors:
  allowed-origins: http://localhost:3000,http://localhost:4173

# Sa-Token 配置（公共）
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 3600
  active-timeout: -1
  # 同一账号重复登录时踢掉旧会话（缩小 Token 被盗后的可用窗口）
  is-concurrent: false
  is-share: false
  token-style: uuid
  is-log: true
  # 安全说明：不再从 Cookie 读取 Token。
  # 前端已改为仅通过 Authorization Header 传递 Token，
  # 从 Cookie 读 Token 会引入 CSRF 攻击面（Cookie 自动携带）。
  is-read-cookie: false

# Knife4j 配置（公共）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      display-name: GRZY API
      paths-to-match: /**
      packages-to-scan: com.example.grzy.controller

# 文件上传配置（公共）
# 安全说明：上传类型白名单统一定义在 FileUploadServiceImpl 中（扩展名 + Content-Type + 魔数三重校验）。
# 不允许 image/svg+xml —— SVG 可内嵌 <script>，存储于同源 /uploads/ 下会造成存储型 XSS。
file:
  upload:
    path: ./uploads
    max-size: 10485760

# 站点信息（前台页脚「本站已运行」卡片使用）
site:
  # 建站日期，用于计算运行天数
  build-date: 2024-11-04
